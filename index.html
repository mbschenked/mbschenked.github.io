<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Max Schenk · Combat Designer</title>
  <meta name="description" content="Max Schenk — Combat Designer. Portfolio." />

  <!-- Google Fonts: Barlow Condensed (display), DM Sans (body), JetBrains Mono (technical) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Sticky top header (rendered into by app.js renderShell on init, but the mount point lives here) -->
  <header id="site-header" class="site-header" role="banner">
    <!-- populated by app.js -->
  </header>

  <!-- Full-width hero — lives ABOVE the two-column grid so the sidebar starts at the tiles row -->
  <div id="hero-mount" class="hero-mount">
    <!-- populated by app.js renderHero (or renderBio for #bio route) -->
  </div>

  <!-- Two-column shell -->
  <div id="layout" class="layout">
    <aside id="sidebar" class="sidebar" aria-label="Portfolio navigation">
      <!-- populated by app.js -->
    </aside>

    <main id="content" class="content" role="main">
      <!-- populated by app.js -->
    </main>
  </div>

  <!-- Lightbox mount (Phase 3d will wire) -->
  <div id="lightbox" class="lightbox" hidden></div>

  <!-- Drawer scrim (Phase 3d mobile drawer) — click to dismiss the sidebar at <900px -->
  <div id="drawer-scrim" class="drawer-scrim" hidden></div>

  <!-- Project data files self-register on window.PROJECTS / window.ABOUT before app.js runs -->
  <script src="projects/tog.js"></script>
  <script src="projects/tbh.js"></script>
  <script src="projects/ai.js"></script>
  <script src="projects/bio.js"></script>
  <script src="app.js"></script>
</body>
</html>
